<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add @brasencase on Snapchat</title>
    <!-- Font Awesome for SVG icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --snap-yellow: #FFFC00;
            --snap-black: #000000;
            --snap-dark: #121212;
            --snap-gray: #1E1E1E;
            --snap-light-gray: #F3F3F3;
            --snap-white: #FFFFFF;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--snap-yellow);
            color: var(--snap-black);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
        }

        /* Header Navigation Bar */
        header {
            width: 100%;
            padding: 1.5rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
        }

        .brand-logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 800;
            font-size: 1.4rem;
            text-decoration: none;
            color: var(--snap-black);
        }

        .brand-logo svg {
            width: 36px;
            height: 36px;
        }

        .nav-btn {
            background: var(--snap-black);
            color: var(--snap-white);
            padding: 10px 20px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.9rem;
            transition: transform 0.2s ease, opacity 0.2s ease;
        }

        .nav-btn:hover {
            opacity: 0.9;
            transform: scale(1.03);
        }

        /* Main Container */
        main {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
            width: 100%;
            max-width: 450px;
            text-align: center;
        }

        /* Snapcode Card Container */
        .snap-card {
            background: var(--snap-white);
            padding: 2.5rem 2rem;
            border-radius: 32px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        .ghost-badge {
            width: 70px;
            height: 70px;
            background: var(--snap-yellow);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 1rem;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .user-title {
            font-size: 1.8rem;
            font-weight: 800;
            margin-bottom: 0.25rem;
            letter-spacing: -0.5px;
        }

        .username {
            font-size: 1.1rem;
            font-weight: 600;
            color: #65676B;
            margin-bottom: 1.5rem;
        }

        /* QR Code Container */
        .qr-wrapper {
            background: var(--snap-yellow);
            padding: 1.25rem;
            border-radius: 24px;
            display: inline-block;
            box-shadow: inset 0 0 0 4px var(--snap-black);
            margin-bottom: 1.5rem;
            position: relative;
        }

        .qr-wrapper img {
            width: 180px;
            height: 180px;
            display: block;
            border-radius: 12px;
        }

        .instructions {
            font-size: 0.95rem;
            color: #444;
            margin-bottom: 1.5rem;
            line-height: 1.4;
        }

        /* Action Buttons */
        .btn-group {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn {
            width: 100%;
            padding: 14px;
            border-radius: 30px;
            font-size: 1rem;
            font-weight: 700;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background: var(--snap-black);
            color: var(--snap-white);
        }

        .btn-primary:hover {
            background: #222222;
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: var(--snap-light-gray);
            color: var(--snap-black);
        }

        .btn-secondary:hover {
            background: #E5E5E5;
        }

        /* Toast notification */
        .toast {
            position: fixed;
            bottom: 30px;
            background: var(--snap-black);
            color: var(--snap-white);
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 0.9rem;
            font-weight: 600;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.3s ease;
            pointer-events: none;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        .toast.show {
            opacity: 1;
            transform: translateY(0);
        }

        /* Footer */
        footer {
            padding: 1.5rem;
            font-size: 0.85rem;
            color: rgba(0,0,0,0.6);
            font-weight: 600;
        }

        footer a {
            color: var(--snap-black);
            text-decoration: underline;
        }
    </style>
</head>
